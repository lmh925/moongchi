<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>스프라이트 시트</title>
<style>body{background:#f6ead8;font-family:sans-serif;margin:8px}canvas{image-rendering:pixelated}h3{margin:6px 0}</style></head>
<body><h3>멍뭉고치 스프라이트 시트 (개발용)</h3><div id="out"></div>
<script type="module">
import { dogSprite, iconCanvas, DOG_W, DOG_H, ICONS } from '/js/sprites.js';
import { BREEDS } from '/shared/data.js';
const qs = new URLSearchParams(location.search); const S = +(qs.get('s') ?? 3);
const poses = [['stand',{}],['walk1',{}],['walk2',{}],['stand',{eyes:'happy',mouth:'tongue',tail:1}],['sit',{}],['paw',{eyes:'happy'}],['beg',{eyes:'happy',mouth:'open'}],['bow',{}],['lie',{eyes:'closed'}],['stand',{eyes:'sad'}],['stand',{fluff:2,eyes:'happy'}],['sit',{equip:{head:'crown',neck:'bowtie',face:'sunglasses'}}],['stand',{equip:{head:'straw_hat',neck:'bandana',face:'star_glasses'}}],['sit',{equip:{head:'wizard',neck:'bib'}}],['sit',{equip:{head:'ribbon'}}],['sit',{equip:{head:'strawberry'}}],['sit',{equip:{head:'flower'}}]];
const out = document.getElementById('out');
const breeds = qs.get('b') ? qs.get('b').split(',') : Object.keys(BREEDS);
const c = document.createElement('canvas');
c.width = DOG_W*S*poses.length; c.height = DOG_H*S*breeds.length*3 + 60;
const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled=false;
breeds.forEach((b,bi)=>{ for(let st=0;st<3;st++){ poses.forEach(([p,o],pi)=>{
  const spr = dogSprite(b, st, p, o);
  ctx.drawImage(spr.canvas, pi*DOG_W*S, (bi*3+st)*DOG_H*S, DOG_W*S, DOG_H*S);
});}});
Object.keys(ICONS).forEach((k,i)=>ctx.drawImage(iconCanvas(k,4), i*50, breeds.length*3*DOG_H*S+10));
out.appendChild(c);
</script></body></html>
