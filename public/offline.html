<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8a5429">
  <title>멍뭉고치</title>
  <style>
    @font-face { font-family: 'Galmuri11'; src: url('/fonts/Galmuri11.woff2') format('woff2'); }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #3f8f3a; font-family: 'Galmuri11', sans-serif; color: #4a3330; }
    .card { background: #fff6e6; border: 4px solid #4a3330; border-radius: 16px; padding: 24px 20px; margin: 16px; max-width: 320px; text-align: center; box-shadow: 0 6px 0 #2d6b2a; }
    img { width: 128px; height: 128px; image-rendering: pixelated; border-radius: 16px; border: 3px solid #4a3330; }
    h1 { font-size: 20px; margin: 14px 0 8px; }
    p { font-size: 14px; line-height: 1.6; margin: 0 0 16px; color: #7a5a50; }
    button { font: inherit; font-weight: 700; font-size: 16px; padding: 10px 22px; border: 3px solid #4a3330; border-radius: 10px; background: #ff9fb8; color: #fff; box-shadow: 0 4px 0 #4a3330; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>인터넷이 끊겼어요</h1>
    <p>강아지가 기다리고 있어요!<br>와이파이나 데이터를 확인하고 다시 눌러 주세요.</p>
    <button onclick="location.reload()">다시 연결하기</button>
  </div>
</body>
</html>
