# Fly.io 배포 설정
app = "moongchi"
primary_region = "nrt" # 도쿄 (한국에서 가장 가까운 지역)

[build]

[env]
  PORT = "3000"
  DB_FILE = "/data/meongmung.db"
  TRUST_PROXY = "1"

# 강아지/친구 데이터가 저장되는 영구 디스크 (1GB)
[mounts]
  source = "meongmung_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # 아무도 접속하지 않으면 서버를 멈춰서 요금을 아끼고, 누가 접속하면 자동으로 켜져요
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
