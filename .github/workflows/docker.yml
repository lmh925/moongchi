# 코드가 올라오면 테스트 후 Docker 이미지를 만들어 GitHub 패키지(ghcr.io)에 올려요.
# NAS의 Watchtower가 새 이미지를 발견하면 게임을 자동으로 업데이트해요.
name: docker

on:
  push:
    branches: [claude/meongmunggocci-game-dev-2s6urt, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lmh925/moongchi:latest
            ghcr.io/lmh925/moongchi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
